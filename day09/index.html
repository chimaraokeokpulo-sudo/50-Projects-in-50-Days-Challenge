<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <!--Quiz Interface -->
        <div id="quiz-screen">
            <h1 id="question_text"></h1>
            <form id="quiz-form">
                <div class="form-group">
                                                                                                                                                       <div class="form-group">
                <label for="question1">Question 1: What is the capital of France?</label>
                <input type="text" id="question1" name="question1" required>
            </div>
            <div class="form-group">
                <label for="question2">Question 2: What is 2 + 2?</label>
                <input type="number" name="question2" id="question2">
            </div>
            <div class="form-group">
                <label for="question3">Question 3: Who wrote 'To Kill a Mockingbird'?</label>
                <input type="text" name="question3" id="question3">
            </div>
            <div class="form-group">
                <label for="question4">Question 4: What is the largest planet in our solar system?</label>
                <input type="text" name="question4" id="question4">
            </div>
            <div class="form-group">
                <label for="question5">Question 5: What is the boiling point of water in Celsius?</label>
                <input type="number" name="question5" id="question5">
            </div>
            <button type="submit">Submit Answers</button>
        </form>
        </div>
</body>
</html>
